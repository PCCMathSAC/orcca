<div class="para">A <dfn class="terminology">variable</dfn> represents an unknown quantity, or a quantity that can change. Algebra often uses <span class="process-math">\(x\)</span> as the variable, but any letter or word can work as a variable. We also often use a letter that stands for something, like <span class="process-math">\(g\)</span> for gas mileage.</div>
