<div class="para logical">
<div class="para">We have to calculate the line’s <span class="process-math">\(x\)</span>-intercept by substituting <span class="process-math">\(y=0\)</span> into the equation:</div>
<div class="displaymath process-math">
\begin{align*}
3x+4y\amp=12\\
3x+4(\substitute{0})\amp=12\\
3x\amp=12\\
x\amp=\divideunder{12}{3}\\
x\amp=4
\end{align*}
</div>
