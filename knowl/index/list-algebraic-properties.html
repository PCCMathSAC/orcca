<figure class="list table-like"><figcaption><span class="type">List</span><span class="space"> </span><span class="codenumber">1.7.7<span class="period">.</span></span><span class="space"> </span>Algebraic Properties</figcaption><div class="named-list-content">
<div class="introduction"><div class="para">Let <span class="process-math">\(a\text{,}\)</span> <span class="process-math">\(b\text{,}\)</span> and <span class="process-math">\(c\)</span> be real numbers, variables, or algebraic expressions. Then the following properties hold:</div></div>
<dl class="description-list narrow">
<dt>Commutative Property of Multiplication</dt>
<dd><div class="para"><span class="process-math">\(\displaystyle a\cdot b=b\cdot a\)</span></div></dd>
<dt>Associative Property of Multiplication</dt>
<dd><div class="para"><span class="process-math">\(\displaystyle a\cdot(b\cdot c)=(a\cdot b)\cdot c\)</span></div></dd>
<dt>Commutative Property of Addition</dt>
<dd><div class="para"><span class="process-math">\(\displaystyle a+b=b+a\)</span></div></dd>
<dt>Associative Property of Addition</dt>
<dd><div class="para"><span class="process-math">\(\displaystyle a+(b+c)=(a+b)+c\)</span></div></dd>
<dt>Distributive Property</dt>
<dd><div class="para">
<span class="process-math">\(\begin{aligned}
a(b+c) \amp=ab+ac\amp\qquad a(b-c) \amp= ab-ac\\
(b+c)a \amp=ba+ca\amp\qquad (b-c)a \amp=ba-ca\\
\frac{b+c}{a} \amp=\frac{b}{a}+\frac{c}{a}\amp\qquad\frac{b-c}{a} \amp=\frac{b}{a}-\frac{c}{a}\\
\end{aligned}\)</span> (The last two versions require <span class="process-math">\(a\neq0\text{.}\)</span>)</div></dd>
</dl>
