<figure class="list table-like"><figcaption><span class="type">List</span><span class="space"> </span><span class="codenumber">4.1.24<span class="period">.</span></span><span class="space"> </span>Three Types of Systems of Two Linear Equations in Two Variables</figcaption><div class="named-list-content"><dl class="description-list narrow">
<dt>Crossing Lines</dt>
<dd><div class="para">If two linear equations make lines with different slopes, the system has one solution. That one solution is the place where the lines cross.</div></dd>
<dt>Parallel Lines</dt>
<dd><div class="para">If two linear equations make lines with the same slope but different <span class="process-math">\(y\)</span>-intercepts, the system has no solution.</div></dd>
<dt>Coinciding Lines</dt>
<dd><div class="para">If two linear equations make lines with the same slope and the same <span class="process-math">\(y\)</span>-intercept (in other words, they make the same line), the system has infinitely many solutions. This solution set consists of all ordered pairs on that line.</div></dd>
</dl></div></figure><span class="incontext"><a class="internal" href="section-solving-a-system-by-graphing.html#list-summary-of-types-of-systems">in-context</a></span>
