<div class="para">A reciprocal is useful because when a fraction is multiplied by its reciprocal, the result is <span class="process-math">\(1\text{.}\)</span> For example, <span class="process-math">\(\frac{2}{3}\cdot\frac{3}{2}=1\text{.}\)</span> This helps us remove a fraction when it is multiplied by the variable.</div>
