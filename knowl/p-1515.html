<div class="para">There is not much difference between the steps to solve this inequality and the steps to solve the <em class="emphasis">equation</em> <span class="process-math">\(t+7=5\text{.}\)</span> We can subtract <span class="process-math">\(7\)</span> from each side.</div>

t+7\subtractright{7}\amp\lt5\subtractright{7}\\
t\amp\lt-2
