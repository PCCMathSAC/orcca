<div class="para">Solve the following system of equations by graphing.</div> <div class="para logical"><div class="displaymath process-math">
\begin{equation*}
\left\{
\begin{alignedat}{4}
y \amp {}={} \amp \tfrac{2}{3}x \amp {}-{} \amp 5 \\
y \amp {}={} \amp {-\tfrac12x} \amp {}+{} \amp 2
\end{alignedat}
\right.
\end{equation*}
