<td class="l t b2 r2 l0 t0 lines">Horizontal Lines</td>

<tr>
<td class="l t b1 r2 l0 t0" style="max-width:282px;"><div class="para logical">
<div class="para">A line is <dfn class="terminology">horizontal</dfn> if and only if its equation can be written</div>
<div class="displaymath process-math">
\begin{equation*}
y=k
\end{equation*}
</div>
<div class="para">for some constant <span class="process-math">\(k\text{.}\)</span>
</div>
</div></td>
<td class="l t b1 r0 l0 t0" style="max-width:282px;"><div class="para logical">
<div class="para">A line is <dfn class="terminology">vertical</dfn> if and only if its equation can be written</div>
<div class="displaymath process-math">
\begin{equation*}
x=h
\end{equation*}
</div>
<div class="para">for some constant <span class="process-math">\(h\text{.}\)</span>
</div>
</div></td>
</tr>
<tr>
<td class="l t b1 r2 l0 t0" style="max-width:282px;"><div class="para logical">
<div class="para">In <a href="" class="xref" data-knowl="./knowl/equation-standard-form.html" title="Equation 3.7.1">standard form</a>, any line with equation</div>
<div class="displaymath process-math" data-contains-math-knowls="./knowl/equation-standard-form.html">
\begin{equation*}
0x+By=C
\end{equation*}
</div>
<div class="para">is horizontal.</div>
</div></td>
<td class="l t b1 r0 l0 t0" style="max-width:282px;"><div class="para logical">
<div class="para">In <a href="" class="xref" data-knowl="./knowl/equation-standard-form.html" title="Equation 3.7.1">standard form</a>, any line with equation</div>
<div class="displaymath process-math" data-contains-math-knowls="./knowl/equation-standard-form.html">
\begin{equation*}
Ax+0y=C
\end{equation*}
</div>
<div class="para">is vertical.</div>
</div></td>
</tr>
<tr>
<td class="l t b1 r2 l0 t0" style="max-width:282px;"><div class="para">If the line with equation <span class="process-math">\(y=k\)</span> is horizontal, it has a <span class="process-math">\(y\)</span>-intercept at <span class="process-math">\((0,k)\)</span> and has slope <span class="process-math">\(0\text{.}\)</span>
</div></td>
<td class="l t b1 r0 l0 t0" style="max-width:282px;"><div class="para">If the line with equation <span class="process-math">\(x=h\)</span> is vertical, it has an <span class="process-math">\(x\)</span>-intercept at <span class="process-math">\((h,0)\)</span> and its slope is <em class="emphasis">undefined</em>. Some say it has <em class="emphasis">no</em> slope, and some say the slope is <em class="emphasis">infinitely large</em>.</div></td>
</tr>
<tr>
<td class="l t b0 r2 l0 t0" style="max-width:282px;"><div class="para logical">
<div class="para">In the <a href="" class="xref" data-knowl="./knowl/equation-slope-intercept-form.html" title="Equation 3.5.1">slope-intercept form</a>, any line with equation</div>
<div class="displaymath process-math" data-contains-math-knowls="./knowl/equation-slope-intercept-form.html">
\begin{equation*}
y=0x+b
\end{equation*}
</div>
<div class="para">is horizontal.</div>
</div></td>
<td class="l t b0 r0 l0 t0" style="max-width:282px;"><div class="para">It’s impossible to write the equation of a vertical line in <a href="" class="xref" data-knowl="./knowl/equation-slope-intercept-form.html" title="Equation 3.5.1">slope-intercept form</a>, because vertical lines do not have a defined slope.</div></td>
