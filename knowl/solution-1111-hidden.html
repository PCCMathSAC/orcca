<div class="para">To change a fraction to decimal, we divide the numerator by the denominator. We can simply copy over the integer part of a mixed number.</div> <div class="para logical"><ol class="lower-alpha">
<li><div class="para"><span class="process-math">\(\displaystyle {7 {\textstyle\frac{3}{4}}} = 7 + 3 \div 4 = 7.75\)</span></div></li>
<li><div class="para"><span class="process-math">\(\displaystyle {7 {\textstyle\frac{5}{16}}} = 7 + 5 \div 16 = 7.3125\)</span></div></li>
</ol></div>
