<h6 class="heading"><span class="type">Paragraph</span></h6>
<div class="para">Is there any number for <span class="process-math">\(x\)</span> that will make <span class="process-math">\(0 \cdot x = 4\)</span> work? No! This is because the product of <span class="process-math">\(0\)</span> and any number is <span class="process-math">\(0\text{,}\)</span> and would never be <span class="process-math">\(4\text{.}\)</span> This is why we say <span class="process-math">\(\frac{4}{0}\)</span> is <em class="alert">undefined</em>.</div>
