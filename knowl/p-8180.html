<div class="para">Similarly, we substitute <span class="process-math">\(x=0\)</span> into the equation to calculate the <span class="process-math">\(y\)</span>-intercept:</div>
<div class="displaymath process-math">
\begin{align*}
2x-3y\amp=-6\\
2(\substitute{0})-3y\amp=-6\\
-3y\amp=-6\\
y\amp=2
\end{align*}
</div>
<div class="para">So the line’s <span class="process-math">\(y\)</span>-intercept is <span class="process-math">\((0,2)\text{.}\)</span>
</div>
