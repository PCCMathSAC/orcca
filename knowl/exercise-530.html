<div class="problem-contents"><div class="para">Think of a number. Add four to your number. Now double that. Then add six. Then halve it. Finally, subtract <span class="process-math">\(7\text{.}\)</span> What is the result? Do you always get the same result, regardless of what number you start with? How does this work? Explain using algebra.</div></div>
