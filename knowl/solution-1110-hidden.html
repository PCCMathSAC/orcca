<div class="para">To change a fraction to decimal, we divide the numerator by the denominator. We can simply copy over the integer part of a mixed number.</div> <div class="para logical"><ol class="lower-alpha">
<li><div class="para"><span class="process-math">\(\displaystyle {4 {\textstyle\frac{6}{25}}} = 4 + 6 \div 25 = 4.24\)</span></div></li>
<li><div class="para"><span class="process-math">\(\displaystyle {2 {\textstyle\frac{5}{8}}} = 2 + 5 \div 8 = 2.625\)</span></div></li>
</ol></div>
