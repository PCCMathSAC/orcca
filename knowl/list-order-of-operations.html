<figure class="list table-like"><figcaption><span class="type">List</span><span class="space"> </span><span class="codenumber">A.5.5<span class="period">.</span></span><span class="space"> </span>Order of Operations</figcaption><div class="named-list-content"><dl class="description-list">
<dt>(P)arentheses and other grouping symbols</dt>
<dd><div class="para">Grouping symbols “group” the expression inside them, and the arithmetic within that group needs to be done first.</div></dd>
<dt>(E)xponentiation</dt>
<dd><div class="para">After grouping symbols, exponentiation has the highest priority. Raise things to powers before doing any other arithmetic.</div></dd>
<dt>(M)ultiplication, (D)ivision, and Negation</dt>
<dd><div class="para">After all exponentiation is done, start doing multiplication, division, and negation. These things all have equal priority. If there are more than one of them in your expression, do these things in order from left to right as you would naturally read the expression.</div></dd>
<dt>(A)ddition and (S)ubtraction</dt>
<dd><div class="para">After all other arithmetic is done, addition and subtraction are all that is left. They have equal priority. If there are more than one of them in your expression, do these things in order from left to right as you would naturally read the expression.</div></dd>
</dl></div></figure><span class="incontext"><a href="section-order-of-operations.html#list-order-of-operations" class="internal">in-context</a></span>
