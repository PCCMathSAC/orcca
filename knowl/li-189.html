<article class="li"><h4 class="heading"><span class="title">All Real Numbers</span></h4>
<div class="para">When solving an equation or inequality boils down to an unambiguously true equation or inequality such as <span class="process-math">\(2=2\)</span> or <span class="process-math">\(0\lt2\text{,}\)</span> then all real numbers are solutions. We write this solution set as <span class="process-math">\((-\infty,\infty)\)</span> or <span class="process-math">\(\mathbb{R}\text{.}\)</span>
