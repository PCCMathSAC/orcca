<div class="para">When <span class="process-math">\(x\)</span> and <span class="process-math">\(y\)</span> are two variables where the rate of change between any two points is always the same, we call this common rate of change the <dfn class="terminology">slope</dfn>. Since having a constant rate of change means the graph will be a straight line, its also called the <dfn class="terminology">slope of the line</dfn>.</div>
