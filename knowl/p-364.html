<div class="para">One of the examples from <a href="" class="xref" data-knowl="./knowl/example-combining-like-terms.html" title="Example 1.2.7">Example 7</a> was <span class="process-math">\(16\,\text{ft}^2+4\,\text{ft}\text{.}\)</span> The units on these two terms look similar, but they are different. <span class="quantity">16 ft<sup>2</sup></span> is a measurement of how much area something has. <span class="quantity">4 ft</span> is a measurement of how long something is. <a href="" class="xref" data-knowl="./knowl/figure-unlike-terms.html" title="Figure 1.2.8">Figure 8</a> illustrates this.</div>
