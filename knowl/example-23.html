<div class="para">If a number <em class="emphasis">minus</em> <span class="process-math">\(2\)</span> equals <span class="process-math">\(6\text{,}\)</span> what is that number? The mystery number must be a little larger than <span class="process-math">\(6\text{.}\)</span> The opposite of subtraction is addition, so if we <em class="emphasis">add</em> <span class="process-math">\(2\)</span> to <span class="process-math">\(6\)</span> we will find the unknown number. So the unknown number is <span class="process-math">\(6+2=8\text{.}\)</span>
