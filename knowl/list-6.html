<figure class="list table-like"><figcaption><span class="type">List</span><span class="space"> </span><span class="codenumber">C.1.1<span class="period">.</span></span><span class="space"> </span>MTH 60 Skills</figcaption><div class="named-list-content"><ol class="decimal">
<li><div class="para logical">
<div class="para">Algebraic Expressions and Equations</div>
<ol class="decimal">
<li><div class="para">Simplify algebraic expressions using the distributive, commutative, and associative properties.</div></li>
<li><div class="para">Evaluate algebraic expressions.</div></li>
<li><div class="para">Translate phrases and sentences into algebraic expressions and equations, and vice versa.</div></li>
<li><div class="para">Distinguish between factors and terms.</div></li>
<li><div class="para">Distinguish between evaluating expressions, simplifying expressions, and solving equations.</div></li>
</ol>
</div></li>
<li><div class="para logical">
<div class="para">Linear Equations and Inequalities in One Variable</div>
<ol class="decimal">
<li><div class="para">Identify linear equations and inequalities in one variable.</div></li>
<li><div class="para">Use the definition of a solution to an equation or inequality to check if a given value is a solution.</div></li>
<li><div class="para">Solve linear equations, including proportions, and non-compound linear inequalities symbolically.</div></li>
<li><div class="para">Express inequality solution sets graphically and with interval notation.</div></li>
<li><div class="para logical">
<div class="para">Create and solve linear equations and inequalities in one variable that model real life situations.</div>
<ol class="decimal">
<li><div class="para">Properly define variables; include units in variable definitions.</div></li>
<li><div class="para">State contextual conclusions using complete sentences.</div></li>
<li><div class="para">Use estimation to determine reasonableness of solutions.</div></li>
</ol>
</div></li>
<li><div class="para">Solve an equation for a specified variable in terms of other variables.</div></li>
<li><div class="para">Solve applications in which two values are unknown but their total is known; for example, a 10-foot board cut into two pieces where one piece is 2.5 feet longer than the other piece.</div></li>
</ol>
</div></li>
<li><div class="para logical">
<div class="para">Introduction to Tables and Graphs</div>
<ol class="decimal">
<li><div class="para">Plot points on the Cartesian coordinate system, including pairs of values from a table.</div></li>
<li><div class="para">Determine coordinates of points by reading a Cartesian graph.</div></li>
<li><div class="para">Create a table of values from an equation or application. Make a plot from the table. When appropriate, correctly identify the independent variable with the horizontal axis and the dependent variable with the vertical axis.</div></li>
<li><div class="para">Classify points by quadrant or as points on an axis; identify the origin.</div></li>
<li><div class="para">Label and scale axes on all graphs.</div></li>
<li><div class="para">Create graphs where the axes are required to have different scales (e.g. <span class="process-math">\(-10\)</span> to <span class="process-math">\(10\)</span> on the horizontal axis and <span class="process-math">\(-1000\)</span> to <span class="process-math">\(1000\)</span> on the vertical axis).</div></li>
<li><div class="para">Interpret graphs, intercepts and other points in the context of an application. Express intercepts as ordered pairs.</div></li>
<li><div class="para">Create tables and graphs with labels that communicate the context of an application problem and its dependent and independent quantities.</div></li>
</ol>
</div></li>
<li><div class="para logical">
<div class="para">Slope</div>
<ol class="decimal">
<li><div class="para">Write and interpret a slope as a rate of change in context (include the unit of the slope).</div></li>
<li><div class="para">Find the slope of a line from a graph, from two points, and from a table of values.</div></li>
<li><div class="para">Find the slope from all forms of a linear equation.</div></li>
<li><div class="para">Given the graph of a line, identify the slope as positive, negative, zero, or undefined. Given two non-vertical lines, identify the line with greater slope.</div></li>
</ol>
</div></li>
<li><div class="para logical">
<div class="para">Linear Equations in Two Variables</div>
<ol class="decimal">
<li><div class="para">Identify a linear equation in two variables.</div></li>
<li><div class="para">Manipulate a linear equation into slope-intercept form; identify the slope and the vertical intercept given a linear equation.</div></li>
<li><div class="para">Recognize equations of horizontal and vertical lines and identify their slopes as zero or undefined.</div></li>
<li><div class="para">Write the equation of a line in slope-intercept form.</div></li>
<li><div class="para">Write the equation of a line in point-slope form.</div></li>
</ol>
</div></li>
<li><div class="para logical">
<div class="para">Graphing Linear Equations in Two Variables</div>
<ol class="decimal">
<li><div class="para">Graph a line with a known point and slope.</div></li>
<li><div class="para">Emphasize that the graph of a line is a visual representation of the solution set to a linear equation.</div></li>
<li><div class="para">Given a linear equation, find at least three ordered pairs that satisfy the equation and graph the line using those ordered pairs.</div></li>
<li><div class="para">Given an equation in slope-intercept form, plot its graph using the slope and vertical intercept.</div></li>
<li><div class="para">Given an equation in point-slope form, plot its graph using the slope and the suggested point.</div></li>
<li><div class="para">Given an equation in standard form, plot its graph by calculating horizontal and vertical intercepts, and check with a third point.</div></li>
<li><div class="para">Given an equation for a vertical or horizontal line, plot its graph.</div></li>
<li><div class="para">Create and graph a linear model based on data and make predictions based upon the model.</div></li>
</ol>
</div></li>
<li><div class="para logical">
<div class="para">Systems of Linear Equations in Two Variables</div>
<ol class="decimal">
<li><div class="para">Solve and check systems of equations using the following methods: graphically, using the substitution method, and using the addition/elimination method.</div></li>
<li><div class="para">Create and solve real-world models involving systems of linear equations in two variables.</div></li>
<li><div class="para">Properly define variables; include units in variable definitions.</div></li>
<li><div class="para">State contextual conclusions using complete sentences.</div></li>
<li><div class="para">Given the equations of two lines, classify them as parallel, perpendicular, or neither.</div></li>
</ol>
</div></li>
</ol></div></figure><span class="incontext"><a href="ccog-mth60.html#list-6" class="internal">in-context</a></span>
