<body class="ignore-math"><div class="solution solution-like"><div class="para">The perimeter is the result from adding the five sides together: <span class="process-math">\(2x+3y+1.5x+5y+x\text{.}\)</span> There are three <span class="process-math">\(x\)</span>-terms that sum to <span class="process-math">\(4.5x\text{,}\)</span> and two <span class="process-math">\(y\)</span>-terms that sum to <span class="process-math">\(8y\text{.}\)</span> So the perimeter is <span class="process-math">\(4.5x+8y\text{.}\)</span>
