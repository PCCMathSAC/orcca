<div class="para">When an equation of a line is written in the form <span class="process-math">\(y=mx+b\text{,}\)</span> it is said to be in <em class="alert">slope-intercept form</em>. In this form, <span class="process-math">\(m\)</span> is the line’s slope, and <span class="process-math">\(b\)</span> is the coordinate on the <span class="process-math">\(y\)</span>-axis where the line intercepts the <span class="process-math">\(y\)</span>-axis.</div>
