<div class="para">The <dfn class="terminology">perimeter</dfn> of a shape is the length of a piece of tape that could be taped tightly around the shape. When a shape has straight side edges, the perimeter comes from adding all of the side lengths together. This can lead to like terms that can be combined.</div>
