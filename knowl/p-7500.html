<h5 class="heading"><span class="type">Paragraph</span></h5>
<div class="para">An important observation right now is that those two lines are parallel. Why? For lines with positive slopes, the bigger a line’s slope, the steeper the line is slanted. As a result, if two lines have the same slope, they are slanted at the same angle, thus they are parallel.</div>
