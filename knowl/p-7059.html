<div class="para">Next, we calculate the line’s <span class="process-math">\(x\)</span>-intercept by substituting <span class="process-math">\(y=0\)</span> into the equation</div>
<div class="displaymath process-math">
\begin{align*}
2x-3y\amp=-6\\
2x-3(\substitute{0})\amp=-6\\
2x\amp=-6\\
x\amp=-3
\end{align*}
</div>
<div class="para">So the line’s <span class="process-math">\(x\)</span>-intercept is <span class="process-math">\((-3,0)\text{.}\)</span>
</div>
