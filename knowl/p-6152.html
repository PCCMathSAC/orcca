<div class="para">A line’s equation in slope-intercept form looks like <span class="process-math">\(y=mx+b\text{,}\)</span> where <span class="process-math">\(m\)</span> is the slope, and <span class="process-math">\(y\)</span> is the <span class="process-math">\(y\)</span>-coordinate of the <span class="process-math">\(y\)</span>-intercept. Since the tree grows at a rate of <span class="process-math">\(0.14\)</span> feet per month, <span class="process-math">\(0.14\)</span> is the slope of the linear model.</div>
