<div class="para">By the slope triangle and <a href="" class="xref" data-knowl="./knowl/equation-slope-definition.html" title="Equation 3.4.1">Equation (3.4.1)</a> we have:</div>
<div class="displaymath process-math" data-contains-math-knowls="./knowl/equation-slope-definition.html">
\begin{align*}
\text{slope}=m\amp =\frac{\Delta y}{\Delta x}\\
\amp =\frac{12\,\text{ft}}{3\,\text{yr}}\\
\amp =4\frac{\text{ft}}{\text{yr}}
\end{align*}
</div>
<div class="para">So the tree is growing at a rate of <span class="quantity">4 <sup>ft</sup>⁄<sub>yr</sub></span>.</div>
</div>
