<h3 class="heading"><span class="type">Paragraph</span></h3>
<div class="para">A <dfn class="terminology">linear expression</dfn> in one variable is an expression that simplifes to the form <span class="process-math">\(ax+b\)</span> where <span class="process-math">\(a\)</span> and <span class="process-math">\(b\)</span> are specific numbers, but <span class="process-math">\(a\neq0\text{.}\)</span> For example, <span class="process-math">\(\frac{2}{5}x+3\)</span> and <span class="process-math">\(5(x+3)-2x\)</span> are linear expressions.</div>
