</div> <div class="para">Next, since <span class="process-math">\(100\cdot100=10000\text{,}\)</span> we have <span class="process-math">\(\sqrt{10000}=100\text{.}\)</span>
</div> <div class="para">Finally, since <span class="process-math">\(1000\cdot1000=1000000\text{,}\)</span> we have <span class="process-math">\(\sqrt{1000000}=1000\text{.}\)</span>
