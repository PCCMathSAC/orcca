<article class="li"><h3 class="heading"><span class="title">Division (not discussed in this section)</span></h3>
<div class="para">Division by some number is the same as multiplication by its reciprocal. So the multiplication rules can be adopted.</div>
<div class="para">Division of <span class="process-math">\(0\)</span> by any nonzero number always results in <span class="process-math">\(0\text{.}\)</span>
</div>
<div class="para">Division of any number by <span class="process-math">\(0\)</span> is always undefined.</div></article><span class="incontext"><a href="section-arithmetic-with-negative-numbers.html#li-904" class="internal">in-context</a></span>
