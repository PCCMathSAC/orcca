<figure class="list table-like"><figcaption><span class="type">List</span><span class="space"> </span><span class="codenumber">2.4.8<span class="period">.</span></span><span class="space"> </span>Special Solution Sets for Equations and Inequalities</figcaption><div class="named-list-content"><dl class="description-list">
<dt>All Real Numbers</dt>
<dd><div class="para">When solving an equation or inequality boils down to an unambiguously true equation or inequality such as <span class="process-math">\(2=2\)</span> or <span class="process-math">\(0\lt2\text{,}\)</span> then all real numbers are solutions. We write this solution set as <span class="process-math">\((-\infty,\infty)\)</span> or <span class="process-math">\(\mathbb{R}\text{.}\)</span>
</div></dd>
<dt>No Solution</dt>
<dd><div class="para">When solving an equation or inequality boils down to an outright false statement such as <span class="process-math">\(0=2\)</span> or <span class="process-math">\(0\gt2\text{,}\)</span> then no real number is a solution. We write this solution set as either <span class="process-math">\(\{\ \}\)</span> or <span class="process-math">\(\emptyset\)</span> or write in words something like “no solutions”.</div></dd>
</dl></div></figure><span class="incontext"><a href="section-special-solution-sets.html#list-special-solution-sets" class="internal">in-context</a></span>
