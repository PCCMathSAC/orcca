<div class="para">Since the first equation has already isolated <span class="process-math">\(y\text{,}\)</span> we will substitute <span class="process-math">\(2x-1\)</span> in for <span class="process-math">\(y\)</span> in the second equation, and we have:</div>
<div class="displaymath process-math">
\begin{align*}
4x-2y\amp=3\\
4x-2\substitute{(2x-1)}\amp=3\\
4x-4x+2\amp=3\\
2\amp=3
\end{align*}
