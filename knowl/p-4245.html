<h3 class="heading"><span class="type">Paragraph</span></h3>
<div class="para">A <dfn class="terminology">graph</dfn> of an equation is a picture of that equation’s solution set. For example, the graph of <span class="process-math">\(y=-2x+3\)</span> is shown in <a href="" class="xref" data-knowl="./knowl/figure-graph-line-full.html" title="Figure 3.2.3.(c)">Figure 3.2.3.(c)</a>. The graph plots the ordered pairs whose coordinates make <span class="process-math">\(y=-2x+3\)</span> true. <a href="" class="xref" data-knowl="./knowl/figure-check-points-for-line.html" title="Figure 3.2.2">Figure 2</a> shows a few points that make the equation true.</div>
