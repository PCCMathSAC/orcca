<div class="para">It’s important to use subscript instead of superscript in the slope equation, because <span class="process-math">\(y^2\)</span> means to take the number <span class="process-math">\(y\)</span> and square it. Whereas <span class="process-math">\(y_2\)</span> tells you that there are at least two <span class="process-math">\(y\)</span>-values in the conversation, and <span class="process-math">\(y_2\)</span> is the second of them.</div>
