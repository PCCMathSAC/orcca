<dd><div class="para">There is no variable.</div></dd>

</div></dd>
<dt><span class="process-math">\(\sqrt{2r}+3=10\)</span></dt>
<dd><div class="para">The variable <span class="process-math">\(r\)</span> is inside the square root.</div></dd>
<dt><span class="process-math">\(5=\frac{2}{s}+3\)</span></dt>
<dd><div class="para">The variable <span class="process-math">\(s\)</span> is in a denominator.</div></dd>
