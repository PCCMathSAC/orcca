<div class="para">To add two fractions with the same denominator, we simply add up the numerators and keep the denominator unchanged.</div> <div class="para"><span class="process-math">\(\displaystyle{\begin{aligned}[t]
-\frac{2}{5} + \frac{4}{5}
\amp = \frac{-2 + 4}{5} \\
\amp = \frac{2}{5}
\end{aligned}
}\)</span></div> <div class="para">The answer is  <span class="process-math">\(\displaystyle{\frac{2}{5}}\text{.}\)</span>
