<div class="para">The generic point-slope equation is <span class="process-math">\(y=m(x-x_0)+y_0\text{.}\)</span> We have found the slope, <span class="process-math">\(m\text{,}\)</span> and we may use <span class="process-math">\((37,40)\)</span> for <span class="process-math">\((x_0,y_0)\text{.}\)</span> So an equation in point-slope form is <span class="process-math">\({y = \frac{25}{12}\mathopen{}\left(x-37\right)+40}\text{.}\)</span>
</div>
